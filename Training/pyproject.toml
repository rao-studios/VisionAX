[project]
name = "visionax-train"
version = "0.1.0"
description = "Trains the VisionAX region-role classifier and exports it to ONNX."
requires-python = ">=3.12"
dependencies = [
    "torch==2.11.*",
    "torchvision==0.26.*",
    "onnx==1.22.*",
    "onnxruntime==1.28.*",
    # PIN: opencv, not PIL. The C++ engine resizes with cv::INTER_AREA and the two
    # sides must agree pixel for pixel; PIL's antialiased bilinear does not.
    "opencv-python-headless>=4.13,<5",
    "numpy>=2",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
    "tqdm>=4",
]

[project.scripts]
vxtrain = "visionax_train.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["visionax_train"]
